<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbf3e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Decopu" />
    <meta
      name="description"
      content="Decopu — cozy puzzles and little shops to make your own."
    />
    <title>Decopu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      #launch-screen{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#fffaf1,#f0dfcd);color:#614638;font-family:system-ui,sans-serif;text-align:center}
      .launch-card{width:min(340px,100%);margin:auto}.launch-mark{display:block;margin:0 auto 20px}.launch-wordmark{font-family:Georgia,serif;font-size:52px;letter-spacing:-2px;margin:0;font-weight:700}.launch-tagline{font-size:15px;color:#826958;margin:10px 0 36px}#launch-status{font-size:13px;line-height:1.5;min-height:40px;margin:0 0 12px}#launch-screen button{display:block;width:100%;min-height:50px;border:0;border-radius:18px;padding:12px 20px;font:700 16px system-ui;color:#fff8ed;background:#536a46;cursor:pointer}#launch-screen button:disabled{opacity:.45;cursor:wait}#launch-screen #launch-retry{margin-top:10px;background:#eadac5;color:#614638}#launch-screen [hidden]{display:none!important}#launch-screen button:focus-visible{outline:3px solid #bc8a2e;outline-offset:4px}.launch-spark{transform-origin:91px 27px;animation:launch-twinkle 2s ease-in-out infinite}@keyframes launch-twinkle{50%{opacity:.55;transform:scale(.8)}}@media(prefers-reduced-motion:reduce){.launch-spark{animation:none}}
    </style>
    <script>
      // Vite rewrites module tags; listen for script-load failures independently.
      window.addEventListener('error', event => {
        const script = event.target;
        if (!script || script.tagName !== 'SCRIPT' || script.type !== 'module') return;
        const failed = () => window.dispatchEvent(new Event('decopu-error'));
        if (document.getElementById('launch-status')) failed();
        else document.addEventListener('DOMContentLoaded', failed, {once:true});
      }, true);
    </script>
  </head>
  <body>
    <div id="launch-screen" role="region" aria-label="Decopu start screen">
      <div class="launch-card">
        <svg class="launch-mark" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><rect x="8" y="8" width="104" height="104" rx="30" fill="#e4ebd5"/><path d="M27 48h66v45H27z" fill="#fff8ec" stroke="#a27a54" stroke-width="3"/><path d="M23 48 34 30h52l11 18" fill="#d9afa2" stroke="#a27a54" stroke-width="3"/><path d="M27 49h66" stroke="#a27a54" stroke-width="3"/><path d="M55 63h21v30H55z" fill="#d9b78a"/><rect x="34" y="62" width="14" height="15" rx="3" fill="#c0d0ac"/><path class="launch-spark" d="m91 15 3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#d5a331"/></svg>
        <p class="launch-wordmark">Decopu</p>
        <p class="launch-tagline">Little puzzles. Lovely places.</p>
        <p id="launch-status" role="status">Preparing your little shop…</p>
        <button id="launch-start" type="button" disabled>Start</button>
        <button id="launch-retry" type="button" hidden>Reload</button>
        <noscript>Please enable JavaScript to play Decopu.</noscript>
      </div>
    </div>
    <div id="app" inert aria-hidden="true"></div>
    <script>
      (() => {
        const start = document.getElementById('launch-start');
        const status = document.getElementById('launch-status');
        const retry = document.getElementById('launch-retry');
        let settled = false;
        let slow;
        const fail = () => {
          if (settled) return;
          settled = true; clearTimeout(slow);
          status.textContent = 'The shop could not finish loading. Reload to try again. Your saved progress is kept.';
          start.disabled = true; retry.hidden = false; retry.focus();
        };
        slow = setTimeout(fail, 20000);
        retry.addEventListener('click', () => location.reload());
        window.addEventListener('decopu-ready', () => {
          if (settled) return;
          settled = true; clearTimeout(slow); start.disabled = false;
          status.textContent = 'Your little shop awaits.'; retry.hidden = true; start.focus();
        }, {once:true});
        window.addEventListener('decopu-error', fail, {once:true});
        window.addEventListener('unhandledrejection', fail, {once:true});
        window.addEventListener('error', fail, {once:true});
      })();
    </script>
    <script type="module" src="/src/main.ts" onerror="window.dispatchEvent(new Event('decopu-error'))"></script>
  </body>
</html>
